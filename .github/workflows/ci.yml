name: CI

# Runs on every PR and on main. The two job names below are the *check contexts*
# that branch protection requires on main — renaming a job renames the required
# check, so if you rename one here, update the protection rule in the same change.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Tests run against H2 (the test profile), so no Docker or database
      # service is needed here. `verify` rather than `test` so packaging
      # problems surface in CI instead of at deploy time.
      - name: Build and test
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress verify

  frontend-tests:
    name: frontend-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Type errors are a real defect class; fail before running the suite.
      - name: Type check
        run: npm run typecheck

      # `vitest` alone enters watch mode and would hang CI — `--run` makes it
      # a single pass.
      - name: Run tests
        run: npm test -- --run
